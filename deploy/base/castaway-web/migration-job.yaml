apiVersion: batch/v1
kind: Job
metadata:
  name: castaway-web-migrate
  labels:
    app.kubernetes.io/name: castaway-web-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: castaway
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: castaway-web-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: castaway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: OnFailure
      containers:
        - name: castaway-web-migrate
          image: ghcr.io/bry-guy/castaway-web:sha-placeholder
          imagePullPolicy: IfNotPresent
          command:
            - /app/castaway-web-migrate
          env:
            - name: MIGRATIONS_DIR
              value: /app/db/migrations
          envFrom:
            - secretRef:
                name: castaway-web-secrets
            # DATABASE_URL; owned by bry-guy/infra (selfhost:platform:castaway:secrets:apply)
            - secretRef:
                name: castaway-web-db
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
