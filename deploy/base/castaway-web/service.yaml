apiVersion: v1
kind: Service
metadata:
  name: castaway-web
  labels:
    app.kubernetes.io/name: castaway-web
    app.kubernetes.io/part-of: castaway
spec:
  selector:
    app.kubernetes.io/name: castaway-web
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Website + /api behind Discord login; the Cloudflare tunnel
    # reaches only this port.
    - name: public
      port: 8090
      targetPort: public
