apiVersion: apps/v1
kind: Deployment
metadata:
  name: castaway-web
  labels:
    app.kubernetes.io/name: castaway-web
    app.kubernetes.io/part-of: castaway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: castaway-web
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: castaway-web
        app.kubernetes.io/part-of: castaway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: castaway-web
          image: ghcr.io/bry-guy/castaway-web:sha-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8090
              name: public
          envFrom:
            - configMapRef:
                name: castaway-web-config
            - secretRef:
                name: castaway-web-secrets
            # DATABASE_URL; owned by bry-guy/infra (selfhost:platform:castaway:secrets:apply)
            - secretRef:
                name: castaway-web-db
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
