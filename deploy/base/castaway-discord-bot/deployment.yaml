apiVersion: apps/v1
kind: Deployment
metadata:
  name: castaway-discord-bot
  labels:
    app.kubernetes.io/name: castaway-discord-bot
    app.kubernetes.io/part-of: castaway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: castaway-discord-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: castaway-discord-bot
        app.kubernetes.io/part-of: castaway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: castaway-discord-bot
          image: ghcr.io/bry-guy/castaway-discord-bot:sha-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: castaway-discord-bot-config
            - secretRef:
                name: castaway-discord-bot-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
