apiVersion: v1
kind: ConfigMap
metadata:
  name: castaway-web-config
  labels:
    app.kubernetes.io/name: castaway-web-config
    app.kubernetes.io/part-of: castaway
data:
  PORT: "8080"
  AUTO_MIGRATE: "false"
  MIGRATIONS_DIR: /app/db/migrations
  SERVICE_AUTH_ENABLED: "true"
  SERVICE_AUTH_PRINCIPAL: castaway-discord-bot
  OTEL_SERVICE_NAME: castaway-web
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=home-k3s,service.namespace=castaway
  PUBLIC_PORT: "8090"
  PUBLIC_BASE_URL: https://castaway.bry-guy.net
  DISCORD_OAUTH_CLIENT_ID: "658231035246673931"
  PUBLIC_INSTANCE_ID: "10"
