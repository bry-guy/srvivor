<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Inside Track · Castaway</title>
<link rel="stylesheet" href="/assets/inside-track.css?v=17">
</head>
<body>
<div class="banner hidden" id="practicing">Practicing…</div>
<div class="pop" id="pop"></div>
<canvas id="c" aria-label="Inside Track board"></canvas>
<div class="hud"><span>BALLS <b id="left">12</b></span><span>CUPS <b id="cups">0/3</b></span></div>
<div class="overlay" id="intro">
  <div class="card">
    <p class="eyebrow">Castaway challenge</p>
    <h1>Inside Track</h1>
    <button id="go" class="primary">Let's go</button>
  </div>
</div>
<div class="overlay hidden" id="done">
  <div class="card">
    <p class="eyebrow">Challenge complete</p>
    <div class="stamps" id="stamps"></div>
    <h1><span id="final">0</span> pts</h1>
    <p id="finalRolls"></p>
    <button id="again" class="primary">Play again</button>
  </div>
</div>
<script src="/assets/inside-track.js?v=17" defer></script>
</body>
</html>
