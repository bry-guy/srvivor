# Loaded only in pi-ez workspaces (MISE_ENV=pi-ez), where Docker comes from the
# workspace's dind sidecar instead of Docker Desktop.
[tools]
docker-cli = "29.9.0"
docker-compose = "5.6.0"

[hooks]
# Docker CLI only finds `docker compose` as a cli-plugin.
postinstall = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sf "$(mise which docker-compose)" "$HOME/.docker/cli-plugins/docker-compose"'
