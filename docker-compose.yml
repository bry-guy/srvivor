# Postgres is not in this file: `mise run //apps/castaway-web:db:up` starts it from
# apps/castaway-web/score.yaml and publishes it on localhost:5432.
services:
  castaway-web:
    container_name: castaway-web
    build:
      context: ./apps/castaway-web
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://castaway:castaway@host.docker.internal:5432/castaway?sslmode=disable
      PORT: "8080"
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: /app/db/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  castaway-discord-bot:
    container_name: castaway-discord-bot
    build:
      context: ./apps/castaway-discord-bot
      dockerfile: Dockerfile
    environment:
      CASTAWAY_DISCORD_BOT_TOKEN:
      CASTAWAY_DISCORD_APPLICATION_ID:
      DISCORD_PODRACING_SERVER_ID:
      CASTAWAY_DISCORD_PUBLIC_KEY:
      CASTAWAY_API_BASE_URL: ${CASTAWAY_API_BASE_URL:-http://castaway-web:8080}
      BOT_STATE_PATH: ${BOT_STATE_PATH:-/app/data/state.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - castaway-discord-bot-data:/app/data
    depends_on:
      castaway-web:
        condition: service_started

volumes:
  castaway-discord-bot-data:
