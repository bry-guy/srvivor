name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci

  validate-home-k3s-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Render home-k3s overlay
        run: kubectl kustomize deploy/environments/home-k3s > /tmp/home-k3s-render.yaml
      - name: Check owned private-image contract
        run: |
          ! grep -Eq 'image: (localhost/|.*:latest|.*:sha-placeholder)' /tmp/home-k3s-render.yaml
          grep -q 'imagePullSecrets:' /tmp/home-k3s-render.yaml
          grep -q 'name: ghcr-pull' /tmp/home-k3s-render.yaml
